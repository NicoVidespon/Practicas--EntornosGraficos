<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ejercicio 3.5</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="estilo.css" />
</head>

<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h1 class="text-center mb-4">Formulario de Contacto</h1>

                        <form>

                            <div class="mb-3">
                                <label for="nombre" class="form-label"> Nombre </label>

                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    placeholder="Ingrese su nombre" required />
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label"> Email </label>

                                <input type="text" class="form-control" id="email" name="email"
                                    placeholder="Ingrese su email" required />
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label"> Teléfono </label>

                                <input type="text" class="form-control" id="telefono" name="telefono"
                                    placeholder="Ingrese su teléfono" required />
                            </div>

                            <div class="mb-3">
                                <label for="asunto" class="form-label"> Asunto </label>

                                <input type="text" class="form-control" id="asunto" name="asunto"
                                    placeholder="Ingrese el asunto" required />
                            </div>

                            <div class="mb-3">
                                <label for="mensaje" class="form-label">
                                    Cuerpo del mensaje
                                </label>

                                <textarea class="form-control" id="mensaje" name="mensaje" rows="5"
                                    placeholder="Escriba su mensaje" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
